<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorFlow - Modern Educator Suite</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f3ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Main Container for Views -->
  <main id="mainContainer" class="max-w-4xl mx-auto space-y-6">
    <!-- Rendered dynamically by js/app.js -->
  </main>

  <!-- Navigation Menu Modal -->
  <div id="navMenuModal" class="modal-bg fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center hidden z-50 p-4 transition-all duration-200">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-xs space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full bg-indigo-500"></div>
          <h3 class="font-bold text-slate-200 text-sm">Navigation</h3>
        </div>
        <button class="closeModal text-slate-400 hover:text-white font-bold p-1">&times;</button>
      </div>
      <div class="flex flex-col space-y-2 font-medium text-sm">
        <button id="navDashboard" class="text-left px-3.5 py-2.5 bg-slate-800/80 hover:bg-slate-700/80 rounded-xl text-slate-200 transition-colors flex items-center gap-3">
          <span>📊</span> Dashboard
        </button>
        <button id="navLab" class="text-left px-3.5 py-2.5 bg-slate-800/80 hover:bg-slate-700/80 rounded-xl text-slate-200 transition-colors flex items-center gap-3">
          <span>🧪</span> Physics Lab
        </button>
        <div class="pl-4 space-y-1 border-l-2 border-slate-800 ml-3">
          <button id="navInclined" class="w-full text-left px-3 py-1.5 text-xs text-slate-400 hover:text-indigo-400 transition-colors block">
            • Inclined Plane
          </button>
          <button id="navRelative" class="w-full text-left px-3 py-1.5 text-xs text-slate-400 hover:text-indigo-400 transition-colors block">
            • Relative Velocity
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Student Management Modal -->
  <div id="studentModal" class="modal-bg fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center hidden z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-white text-base flex items-center gap-2">
          <span class="text-indigo-400">🎓</span> Add / Manage Students
        </h3>
        <button class="closeModal text-slate-400 hover:text-white font-bold p-1">&times;</button>
      </div>
      <form id="studentForm" class="space-y-3">
        <div>
          <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Student Name</label>
          <input type="text" id="stName" placeholder="e.g. Rahat Chowdhury" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Phone</label>
            <input type="text" id="stPhone" placeholder="017xxxxxxxx" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
          </div>
          <div>
            <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Class / Subject</label>
            <input type="text" id="stClass" placeholder="HSC Physics" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
          </div>
        </div>
        <div>
          <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Monthly Fee (৳)</label>
          <input type="number" id="stSalary" placeholder="e.g. 5000" min="0" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-white py-2.5 rounded-xl text-xs transition-colors shadow-lg shadow-indigo-600/20">
          + Save Student
        </button>
      </form>
      <div class="border-t border-slate-800 pt-3">
        <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Registered Students:</p>
        <div class="space-y-2 max-h-48 overflow-y-auto pr-1" id="studentListContainer">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <!-- Pending Tasks Management Modal -->
  <div id="taskModal" class="modal-bg fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center hidden z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-white text-base flex items-center gap-2">
          <span class="text-indigo-400">📝</span> Add & Manage Tasks
        </h3>
        <button class="closeModal text-slate-400 hover:text-white font-bold p-1">&times;</button>
      </div>
      <form id="taskForm" class="space-y-3">
        <div>
          <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Task Description</label>
          <input type="text" id="taskWork" placeholder="e.g. Prepare Vector Kinematics Exam Paper" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
        </div>
        <div>
          <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Scheduled Time / Due</label>
          <input type="text" id="taskTime" placeholder="e.g. 10:00 AM / Tomorrow" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-white py-2.5 rounded-xl text-xs transition-colors shadow-lg shadow-indigo-600/20">
          + Add Task
        </button>
      </form>

      <div class="border-t border-slate-800 pt-3">
        <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">All Tasks:</p>
        <div id="taskListModalContainer" class="space-y-2 max-h-48 overflow-y-auto pr-1">
          <!-- Task list rendered dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- Teaching Progress Modal -->
  <div id="teachingModal" class="modal-bg fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center hidden z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-white text-base flex items-center gap-2">
          <span class="text-indigo-400">📈</span> Teaching Progress Entry
        </h3>
        <button class="closeModal text-slate-400 hover:text-white font-bold p-1">&times;</button>
      </div>
      <form id="teachingForm" class="space-y-3">
        <div>
          <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Select Student</label>
          <select id="tpStudentSelect" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
            <!-- Populated from active students -->
          </select>
        </div>
        <div>
          <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Target Chapter / Topic</label>
          <input type="text" id="tpChapter" placeholder="e.g. Integration / Vector Dynamics" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
        </div>
        <div>
          <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Syllabus Completion (%)</label>
          <input type="number" id="tpProgress" min="0" max="100" placeholder="e.g. 75" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-white py-2.5 rounded-xl text-xs transition-colors shadow-lg shadow-indigo-600/20">
          Save Progress Record
        </button>
      </form>
    </div>
  </div>

  <!-- Exam Marks Modal -->
  <div id="examModal" class="modal-bg fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center hidden z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-white text-base flex items-center gap-2">
          <span class="text-indigo-400">🏆</span> Add Exam Marks
        </h3>
        <button class="closeModal text-slate-400 hover:text-white font-bold p-1">&times;</button>
      </div>
      <form id="examForm" class="space-y-3">
        <div>
          <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Select Student</label>
          <select id="epStudentSelect" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
            <!-- Populated from active students -->
          </select>
        </div>
        <div>
          <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Exam Title</label>
          <input type="text" id="epExam" placeholder="e.g. Monthly Test 1" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
        </div>
        <div>
          <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Chapter</label>
          <input type="text" id="epChapt" placeholder="e.g. Kinematics" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
        </div>
        <div>
          <label class="text-[11px] uppercase font-semibold text-slate-400 tracking-wider">Score Obtained (%)</label>
          <input type="number" id="epMarks" min="0" max="100" placeholder="e.g. 85" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none mt-1">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold text-white py-2.5 rounded-xl text-xs transition-colors shadow-lg shadow-indigo-600/20">
          Save Exam Record
        </button>
      </form>
    </div>
  </div>

  <!-- Modular Scripts -->
  <script src="js/sim-inclined.js"></script>
  <script src="js/sim-relative.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
